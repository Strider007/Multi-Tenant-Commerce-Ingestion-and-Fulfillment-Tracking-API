version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: logistics-mysql
    environment:
      MYSQL_ROOT_PASSWORD: localpass
      MYSQL_DATABASE: logistics_platform
    ports:
      - "3307:3306"
    volumes:
      - ./fenix_test_db.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
